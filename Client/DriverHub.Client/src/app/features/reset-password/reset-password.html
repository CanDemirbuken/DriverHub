<div class="admin-reset-password">
  <div class="admin-reset-password__card">
    <div class="admin-reset-password__header">
      <div class="admin-reset-password__logo">
        DH
      </div>

      <h1>DriverHub</h1>
      <p>Yeni şifrenizi belirleyin.</p>
    </div>

    <form class="admin-reset-password__form" (ngSubmit)="resetPassword()">
      <div class="admin-reset-password__field">
        <label for="password">Yeni Şifre</label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Yeni şifrenizi girin"
          autocomplete="new-password" />
      </div>

      <div class="admin-reset-password__field">
        <label for="passwordConfirm">Yeni Şifre Tekrar</label>

        <input
          id="passwordConfirm"
          name="passwordConfirm"
          type="password"
          [(ngModel)]="passwordConfirm"
          placeholder="Yeni şifrenizi tekrar girin"
          autocomplete="new-password" />
      </div>

      @if (password && passwordConfirm && password !== passwordConfirm) {
        <div class="admin-reset-password__error">
          Şifreler eşleşmiyor.
        </div>
      }

      <button type="submit" class="admin-reset-password__button">
        Şifreyi Sıfırla
      </button>
    </form>

    <div class="admin-reset-password__actions">
      <a [routerLink]="loginLink">
        Giriş ekranına dön
      </a>
    </div>
  </div>
</div>
