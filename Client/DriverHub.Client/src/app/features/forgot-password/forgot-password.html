<div class="admin-forgot-password">
  <div class="admin-forgot-password__card">
    <div class="admin-forgot-password__header">
      <div class="admin-forgot-password__logo">
        DH
      </div>

      <h1>DriverHub</h1>
      <p>Şifrenizi sıfırlamak için devam edin.</p>
    </div>

    <form class="admin-forgot-password__form" (ngSubmit)="sendResetLink()">
      <div class="admin-forgot-password__field">
        <label for="email">E-mail</label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="E-mail adresinizi girin"
          autocomplete="email" />
      </div>

      <button type="submit" class="admin-forgot-password__button">
        Şifre Sıfırlama Linki Gönder
      </button>

      @if (isSent) {
        <div class="admin-forgot-password__success">
          Şifre sıfırlama bağlantısı e-posta adresinize gönderildi.
        </div>
      }
    </form>

    <div class="admin-forgot-password__actions">
      <a [routerLink]="loginLink">
        Giriş ekranına dön
      </a>
    </div>
  </div>
</div>
